<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLeadBot</title>
    <script>
      (function () {
        var loc = window.location;
        var redirect = loc.origin + '/?p=' + encodeURIComponent(loc.pathname);
        if (loc.search) {
          redirect += '&q=' + encodeURIComponent(loc.search.substring(1));
        }
        redirect += loc.hash;
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
